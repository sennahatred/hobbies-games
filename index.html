<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hobbies de Games na Área Profissional</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300&display=swap" rel="stylesheet">
<style>
:root{--bg:#04050a;--fg:#f4f6fb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--fg);font-family:'Outfit','Helvetica Neue',Arial,sans-serif;-webkit-tap-highlight-color:transparent;user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.v{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 55% 38%,transparent 38%,rgba(0,0,0,.8) 100%)}
.t{position:fixed;left:6vw;right:6vw;bottom:calc(9vh + env(safe-area-inset-bottom,0px));margin:0;font-weight:200;font-size:clamp(2.1rem,7vw,6.4rem);line-height:1.06;letter-spacing:.16em;text-transform:uppercase;text-shadow:0 0 60px rgba(255,255,255,.18);opacity:0;transform:translateY(26px);filter:blur(14px);transition:opacity 1.1s ease,transform 1.5s cubic-bezier(.2,.8,.2,1),filter 1.1s ease;pointer-events:none}
.t.on{opacity:1;transform:none;filter:none;transition-delay:.4s}
.d{position:fixed;left:6vw;bottom:calc(3.6vh + env(safe-area-inset-bottom,0px));display:flex;gap:10px;pointer-events:none}
.d i{width:22px;height:2px;background:var(--fg);opacity:.18;transition:all .8s ease}
.d i.on{width:52px;opacity:.7}
@media (prefers-reduced-motion:reduce){.t{transition-duration:.01s;transition-delay:0s}}
</style>
</head>
<body>
<div class="v"></div>
<h1 class="t">Como<br>conheci</h1>
<h1 class="t">Minha<br>jornada</h1>
<h1 class="t">Conexão<br>profissional</h1>
<div class="d"><i></i><i></i><i></i></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const r=new THREE.WebGLRenderer({antialias:true});
r.setPixelRatio(Math.min(devicePixelRatio,2));
r.shadowMap.enabled=true;r.shadowMap.type=THREE.PCFSoftShadowMap;
r.toneMapping=THREE.ACESFilmicToneMapping;r.toneMappingExposure=1.05;r.outputEncoding=THREE.sRGBEncoding;
document.body.prepend(r.domElement);
const sc=new THREE.Scene();sc.background=new THREE.Color(0x04050a);
const cam=new THREE.PerspectiveCamera(35,1,.1,200);

// ambiente de reflexo (estúdio escuro com painéis de luz)
const es=new THREE.Scene();es.background=new THREE.Color(0x0a0c12);
[[0xffffff,7,[0,9,0],[12,.3,12]],[0xff9a4d,5,[-9,2,0],[.3,6,8]],[0x6aa8ff,5,[9,3,2],[.3,6,9]],[0xffffff,3,[0,3,-10],[10,4,.3]]].forEach(a=>{
  const m=new THREE.Mesh(new THREE.BoxGeometry(...a[3]),new THREE.MeshBasicMaterial({color:new THREE.Color(a[0]).multiplyScalar(a[1])}));
  m.position.set(...a[2]);es.add(m)});
sc.environment=new THREE.PMREMGenerator(r).fromScene(es,.04).texture;

function rad(st,n=128){const c=document.createElement('canvas');c.width=c.height=n;const x=c.getContext('2d'),g=x.createRadialGradient(n/2,n/2,0,n/2,n/2,n/2);st.forEach(s=>g.addColorStop(s[0],s[1]));x.fillStyle=g;x.fillRect(0,0,n,n);return new THREE.CanvasTexture(c)}
function glow(c,s){const m=new THREE.Sprite(new THREE.SpriteMaterial({map:rad([[0,c+'cc'],[.3,c+'44'],[1,c+'00']]),blending:THREE.AdditiveBlending,depthWrite:false,transparent:true}));m.scale.set(s,s,1);return m}

const metal=new THREE.MeshStandardMaterial({color:0xc4c8d2,metalness:1,roughness:.2});
const glass=new THREE.MeshPhysicalMaterial({color:0xdbeaff,roughness:.06,transmission:1,thickness:1.5,ior:1.5,clearcoat:1,envMapIntensity:1.6});
const emi=(c,i=2.5)=>new THREE.MeshStandardMaterial({color:c,emissive:c,emissiveIntensity:i,roughness:.4});
const acr=c=>new THREE.MeshPhysicalMaterial({color:c,roughness:.15,metalness:.1,clearcoat:1,transmission:.45,thickness:.6});
function mesh(g,m,x=0,y=0,z=0){const o=new THREE.Mesh(g,m);o.position.set(x,y,z);o.castShadow=true;return o}

const G=[];
function stage(i,col){
  const g=new THREE.Group(),c=new THREE.Group();g.position.x=i*40;
  const fl=new THREE.Mesh(new THREE.CircleGeometry(20,64),new THREE.MeshStandardMaterial({color:0x0a0c12,metalness:.8,roughness:.3,envMapIntensity:.5,transparent:true,alphaMap:rad([[0,'#fff'],[.5,'#888'],[1,'#000']])}));
  fl.rotation.x=-Math.PI/2;fl.position.y=-2;fl.receiveShadow=true;
  const s=new THREE.SpotLight(0xffffff,2.2,0,.85,.9);s.position.set(-6,14,7);s.castShadow=true;s.shadow.mapSize.set(1024,1024);s.shadow.bias=-.0005;
  const p=new THREE.PointLight(col,3,30);p.position.set(5,2,-4);
  g.add(fl,s,s.target,p,c);sc.add(g);g.userData={a:0,t:0,c,k:1};G.push(g);return c}

// SLIDE 1 — descoberta: cubo de vidro com núcleo luminoso
const c1=stage(0,0xff8a3d);
const cube=mesh(new THREE.BoxGeometry(2.4,2.4,2.4),glass),core=mesh(new THREE.BoxGeometry(.75,.75,.75),emi(0xff7a2a,3)),h1=glow('#ff8a3d',6);
const rg=[0,1].map(j=>{const m=mesh(new THREE.TorusGeometry(2.1+j*.5,.025,12,160),metal);m.rotation.set(1.2+j,j*.6,0);return m});
c1.add(cube,core,h1,...rg);

// SLIDE 2 — jornada: trilha 3D com plataformas e orbe em movimento
const c2=stage(1,0x38d6c9);
const pts=[[-7.5,-1,2],[-4.5,0,-1],[-1.5,-.6,2.5],[1.5,1,-.5],[4.5,0,2],[7.5,1.4,-1]].map(p=>new THREE.Vector3(...p));
const curve=new THREE.CatmullRomCurve3(pts);
c2.add(mesh(new THREE.TubeGeometry(curve,220,.07,10),metal));
const cols=[0xff8a3d,0x38d6c9,0x7c6cff,0xff5fa2,0xf4d35e,0x5ec2ff];
const geos=[()=>new THREE.BoxGeometry(.7,.7,.7),()=>new THREE.OctahedronGeometry(.5),()=>new THREE.IcosahedronGeometry(.5),()=>new THREE.TorusKnotGeometry(.3,.1,64,8),()=>new THREE.ConeGeometry(.45,.9,4),()=>new THREE.SphereGeometry(.45,32,16)];
const tops=pts.map((p,k)=>{
  c2.add(mesh(new THREE.CylinderGeometry(.95,.95,.12,48),acr(cols[k]),p.x,p.y-.2,p.z));
  const o=mesh(geos[k](),k%2?glass:metal,p.x,p.y+.5,p.z);c2.add(o);return o});
const orb=mesh(new THREE.SphereGeometry(.26,32,16),emi(0x7ffcf0,3)),oh=glow('#38d6c9',3);orb.add(oh);c2.add(orb);

// SLIDE 3 — conexão: controle de vidro e rede de nós
const c3=stage(2,0x8f6bff);
const K=new THREE.Group(),bd=mesh(new THREE.SphereGeometry(1,64,32),glass);bd.scale.set(1.7,.5,.95);K.add(bd);
[-1,1].forEach(s=>{const gp=mesh(new THREE.SphereGeometry(1,48,24),glass,s*1.5,-.05,.6);gp.scale.set(.6,.5,1.1);gp.rotation.y=s*.3;K.add(gp)});
[[-.95,-.1],[.5,.45]].forEach(p=>{K.add(mesh(new THREE.CylinderGeometry(.2,.22,.14,32),metal,p[0],.52,p[1]),mesh(new THREE.SphereGeometry(.17,24,12),metal,p[0],.62,p[1]))});
K.add(mesh(new THREE.BoxGeometry(.55,.1,.19),metal,-.5,.5,.45),mesh(new THREE.BoxGeometry(.19,.1,.55),metal,-.5,.5,.45));
[[0,.28,0xffd23f],[.28,0,0xff4d6d],[0,-.28,0x38d6c9],[-.28,0,0x6aa8ff]].forEach(b=>K.add(mesh(new THREE.CylinderGeometry(.13,.13,.1,24),emi(b[2],2),.95+b[0],.5,-.1+b[1])));
K.rotation.x=.55;
const net=new THREE.Group(),N=[];
const shp=[()=>new THREE.SphereGeometry(.28,32,16),()=>new THREE.BoxGeometry(.42,.42,.42),()=>new THREE.OctahedronGeometry(.34)],mt=[glass,metal,emi(0x8f6bff,1.6)];
for(let k=0;k<9;k++){
  const a=k*2.4,rr=4+(k%3)*.8,p=new THREE.Vector3(Math.cos(a)*rr*1.35,Math.sin(k*1.9)*2,Math.sin(a)*rr*.6-1);
  const n=mesh(shp[k%3](),mt[k%3]);n.position.copy(p);
  const ln=new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(),p]),new THREE.LineBasicMaterial({color:0x9a85ff,transparent:true,opacity:.55}));
  const pu=mesh(new THREE.SphereGeometry(.07,12,8),emi(0xffffff,4));pu.castShadow=false;
  net.add(n,ln,pu);N.push({n,ln,pu,p})}
c3.add(K,net,glow('#8f6bff',9));

// navegação
const T=[...document.querySelectorAll('.t')],D=[...document.querySelectorAll('.d i')],DIST=[10.5,21,15];
let cur=0,cx=0,cd=DIST[0],pf=1;
function go(n){cur=Math.max(0,Math.min(2,n));T.forEach((e,i)=>e.classList.toggle('on',i==cur));D.forEach((e,i)=>e.classList.toggle('on',i==cur))}
addEventListener('keydown',e=>{if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key))go(cur+1);if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key))go(cur-1)});
let sx=0;addEventListener('pointerdown',e=>sx=e.clientX);
addEventListener('pointerup',e=>{const d=e.clientX-sx;go(cur+(Math.abs(d)>40?(d<0?1:-1):(e.clientX<innerWidth*.3?-1:1)))});
function rs(){const w=innerWidth,h=innerHeight,a=w/h;r.setSize(w,h);cam.aspect=a;cam.setViewOffset(w,h,a>1?-w*.15:0,a>1?0:h*.13,w,h);pf=a<1?1+(1-a)*.5:1;G[1].userData.k=a<1?.55:1;G[2].userData.k=a<1?.78:1}
addEventListener('resize',rs);rs();go(0);

const clk=new THREE.Clock();
(function loop(){
  requestAnimationFrame(loop);
  const dt=Math.min(clk.getDelta(),.05),t=clk.elapsedTime;
  G.forEach((g,i)=>{const u=g.userData,on=i==cur;u.a+=((on?1:0)-u.a)*Math.min(1,dt*2.2);u.t=on?u.t+dt:0;u.c.visible=u.a>.01;u.c.scale.setScalar(Math.max(.001,u.a)*u.k)});
  // slide 1
  c1.position.y=Math.sin(t*.9)*.15;cube.rotation.set(t*.12,t*.25,0);core.rotation.set(-t*.4,-t*.3,0);
  rg[0].rotation.z=t*.3;rg[1].rotation.z=-t*.22;h1.material.opacity=.7+.3*Math.sin(t*2);
  // slide 2
  tops.forEach((o,k)=>{o.rotation.y=t*.6+k;o.position.y=pts[k].y+.5+Math.sin(t+k)*.08});
  orb.position.copy(curve.getPointAt((t*.05)%1)).y+=.35;
  // slide 3
  K.rotation.y=Math.sin(t*.4)*.35;K.position.y=Math.sin(t*.8)*.1;
  N.forEach((o,k)=>{const q=Math.min(1,Math.max(0,(G[2].userData.t-.6-k*.18)/.9)),e=q*q*(3-2*q);
    o.n.scale.setScalar(Math.max(.001,e));o.ln.scale.setScalar(Math.max(.001,e));o.n.rotation.y=t*.5;o.n.position.y=o.p.y+Math.sin(t+k)*.12;
    o.pu.visible=e>.99;o.pu.position.copy(o.p).multiplyScalar((t*.35+k*.17)%1)});
  // câmera
  cx+=(cur*40-cx)*Math.min(1,dt*1.6);cd+=(DIST[cur]*pf-cd)*Math.min(1,dt*1.6);
  cam.position.set(cx+Math.sin(t*.15)*1.5,2.6,cd);cam.lookAt(cx,0,0);
  r.render(sc,cam);
})();
</script>
</body>
</html>
